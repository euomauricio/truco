<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Truco de Boteco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c3a25">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: mesa de feltro verde com borda de madeira; placar em cima, sua mão embaixo, parceiro em frente, adversários nas laterais */
:root{
  --page:#0c3a25; --felt:#17784b; --felt-edge:#0f5233; --rim:#6a4222; --rim-hi:#8a5a30;
  --ink:#f6f1e4; --ink-dim:rgba(246,241,228,.68); --chip:rgba(255,255,255,.11);
  --card:#fffdf6; --card-edge:#d8cfbc;
  --back-1:#8f1d2c; --back-2:#b02a3c;
  --gold:#f3c34f; --gold-deep:#a9780f; --hot:#d8432c; --hot-deep:#922713; --btn-ink:#2b1d00;
  --us:#66d9a0; --them:#ff8a78;
  --panel:rgba(7,28,18,.95); --sheet:#123f2a; --bubble:#fffdf6; --bubble-ink:#1e1b16;
  --f-display:"Alfa Slab One","Rockwell","Georgia",serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#06170e; --felt:#11613c; --felt-edge:#0a3d25; --rim:#4f3019; --rim-hi:#6b4425;
  --card:#f3ede0; --card-edge:#bfb49d; --panel:rgba(4,18,11,.96); --sheet:#0d2e1f; --bubble:#f3ede0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#06170e; --felt:#11613c; --felt-edge:#0a3d25; --rim:#4f3019; --rim-hi:#6b4425;
  --card:#f3ede0; --card-edge:#bfb49d; --panel:rgba(4,18,11,.96); --sheet:#0d2e1f; --bubble:#f3ede0;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:15px;line-height:1.35;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* placar */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:14px;background:var(--chip)}
.score.them{flex-direction:row-reverse}
.score .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim)}
.score b{font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.score.us b{color:var(--us)} .score.them b{color:var(--them)}
.mid{text-align:center;min-width:96px}
.val{font-size:12px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.dots{display:flex;gap:6px;justify-content:center;margin-top:5px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink-dim)}
.dot.us{background:var(--us);border-color:var(--us)}
.dot.them{background:var(--them);border-color:var(--them)}
.dot.tie{background:var(--ink-dim)}

/* mesa */
.table{position:relative;flex:1;min-height:290px;border-radius:30px;
  background:radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt-edge) 100%);
  box-shadow:inset 0 0 0 7px var(--rim),inset 0 0 0 9px var(--rim-hi),inset 0 0 50px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3)}
.vira{position:absolute;left:18px;top:18px;display:flex;gap:7px;align-items:center}
.vira .card{--cw:38px}
.vira-lbl{font-size:11px;color:var(--ink-dim);line-height:1.25}
.vira-lbl b{color:var(--gold);font-weight:900}
.tbtn{position:absolute;top:16px;width:38px;height:38px;border-radius:50%;background:var(--chip);font-size:18px;display:grid;place-items:center}
.menu-btn{right:16px}
.snd-btn{right:60px}
.snd-btn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;width:72px;text-align:center}
.s2{top:16px;left:50%;transform:translateX(-50%)}
.s1{right:12px;top:50%;transform:translateY(-50%)}
.s3{left:12px;top:50%;transform:translateY(-50%)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--chip);border:2.5px solid var(--them);transition:box-shadow .2s}
.seat.partner .avatar{border-color:var(--us)}
.seat.turn .avatar{box-shadow:0 0 0 4px var(--gold)}
.name{font-size:12px;font-weight:800}
.backs{display:flex;height:28px;padding-left:8px}
.back{background:repeating-linear-gradient(45deg,var(--back-1) 0 4px,var(--back-2) 4px 8px);border:2px solid var(--card);border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.back.mini{width:19px;height:28px;margin-left:-8px}

.pile{position:absolute;left:50%;top:52%;width:158px;height:190px;transform:translate(-50%,-50%)}
.slot{position:absolute}
.slot .card{--cw:52px}
.slot.p0{left:50%;bottom:0;transform:translateX(-50%)}
.slot.p2{left:50%;top:0;transform:translateX(-50%)}
.slot.p1{right:0;top:50%;transform:translateY(-50%) rotate(5deg)}
.slot.p3{left:0;top:50%;transform:translateY(-50%) rotate(-5deg)}
.slot.p0{--fx:0;--fy:70px}.slot.p2{--fx:0;--fy:-70px}.slot.p1{--fx:70px;--fy:0}.slot.p3{--fx:-70px;--fy:0}
.slot.enter .card{animation:drop .3s cubic-bezier(.2,.8,.3,1)}
@keyframes drop{from{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.85)}}
.slot.win .card{box-shadow:0 0 0 3px var(--gold),0 8px 22px rgba(0,0,0,.45)}

/* cartas do baralho espanhol */
.card{--cw:76px;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.09);position:relative;flex:none;display:block;overflow:hidden}
.card.face{background:var(--card);box-shadow:0 2px 0 var(--card-edge),0 6px 14px rgba(0,0,0,.28)}
.card svg{display:block;width:100%;height:100%}
.card.man{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.28);overflow:visible}
.card.man::after{content:"★";position:absolute;right:-7px;top:-9px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--btn-ink);font-size:12px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.35)}

/* sua mão */
.hand{display:flex;justify-content:center;gap:10px;min-height:calc(min(84px,25vw)*1.5 + 12px);padding-top:12px}
.hand .card{--cw:min(84px,25vw);transition:transform .15s,filter .2s}
.hand.active .card:hover,.hand.active .card:focus-visible{transform:translateY(-10px)}
.hand:not(.active) .card{filter:brightness(.8) saturate(.85)}

.actions{min-height:56px;display:flex;align-items:center;justify-content:center;gap:12px}
.status{color:var(--ink-dim);font-size:14px}
.btn{padding:12px 20px;border-radius:14px;font-weight:900;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--gold);color:var(--btn-ink);box-shadow:0 3px 0 var(--gold-deep)}
.btn.hot{background:var(--hot);color:#fff;box-shadow:0 3px 0 var(--hot-deep)}
.btn.ghost{background:var(--chip)}
.btn.big{width:100%;padding:15px;font-size:17px}
.btn.truco{background:var(--hot);color:#fff;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.05em;padding:12px 30px;box-shadow:0 4px 0 var(--hot-deep);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* falas e avisos */
.bubble{position:absolute;z-index:5;background:var(--bubble);color:var(--bubble-ink);font-weight:900;padding:6px 11px;border-radius:12px;white-space:nowrap;font-size:14px;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble.big{background:var(--hot);color:#fff;font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.04em}
.s2 .bubble{top:calc(100% + 4px)}
.s1 .bubble{right:calc(100% + 2px);top:6px}
.s3 .bubble{left:calc(100% + 2px);top:6px}
.b0{left:50%;bottom:14px;transform:translateX(-50%) scale(.6)}
.b0.show{transform:translateX(-50%) scale(1)}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--panel);padding:12px 18px;border-radius:16px;font-weight:900;font-size:17px;opacity:0;transition:.2s;pointer-events:none;z-index:6;text-align:center;width:max-content;max-width:80%}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;background:var(--panel);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);text-align:center;display:flex;flex-direction:column;gap:10px}
.sh-title{font-size:17px}
.sh-title .callx{font-family:var(--f-display);font-weight:400;color:var(--hot);font-size:21px;letter-spacing:.04em}
.sh-sub{font-size:13px;color:var(--ink-dim)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btns .btn{flex:1;min-width:84px}
.peek{display:flex;gap:10px;justify-content:center;padding-top:6px}
.peek .card{--cw:46px}

/* telas */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.modal-card{width:100%;max-width:380px;background:var(--sheet);border-radius:26px;padding:26px 22px;text-align:center;max-height:92%;overflow:auto;box-shadow:inset 0 0 0 2px var(--chip),0 20px 50px rgba(0,0,0,.5)}
.fan{display:flex;justify-content:center;height:70px;margin-bottom:4px}
.fan .card{--cw:44px;margin:0 -6px;transform-origin:50% 120%}
.fan .card:nth-child(1){transform:rotate(-16deg) translateY(6px)}
.fan .card:nth-child(2){transform:rotate(-5deg)}
.fan .card:nth-child(3){transform:rotate(5deg)}
.fan .card:nth-child(4){transform:rotate(16deg) translateY(6px)}
.modal-card h1{font-family:var(--f-display);font-weight:400;font-size:52px;margin:6px 0 2px;color:var(--gold);text-wrap:balance;line-height:1.05}
.modal-card h1.small{font-size:34px}
.sub{color:var(--ink-dim);margin:0 0 4px;font-size:14px}
.final{font-family:var(--f-display);font-size:30px;margin:6px 0}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin:18px 0 14px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:800;color:var(--ink-dim)}
.seg button[aria-checked="true"]{background:var(--gold);color:var(--btn-ink)}
.seg-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim);margin-top:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.rules{text-align:left;margin-top:16px;font-size:14px;color:var(--ink-dim);font-weight:600}
.rules summary{cursor:pointer;font-weight:800;color:var(--ink)}
.rules ul{padding-left:18px;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.rules b{color:var(--ink)}
/* mesa online */
.field{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:16px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim)}
.inp{width:100%;min-width:0;padding:13px 14px;border-radius:12px;border:2px solid var(--chip);background:rgba(0,0,0,.22);color:var(--ink);font:inherit;font-size:16px}
.inp:focus{outline:none;border-color:var(--gold)}
.inp.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--f-display);font-weight:400}
.row{display:flex;gap:8px;margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:12px;margin-top:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--chip)}
.msg{min-height:20px;font-size:13px;color:var(--them);margin:10px 0 4px}
.codebox{font-family:var(--f-display);font-size:42px;letter-spacing:.18em;color:var(--gold);margin:2px 0 8px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.team-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim)}
.seatbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 8px;border-radius:14px;background:var(--chip);border:2px solid transparent;min-height:68px}
.seatbtn.empty{border-style:dashed;border-color:var(--chip);background:transparent}
.seatbtn.mine{border-color:var(--gold)}
.seatbtn .nm{font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatbtn .sub2{font-size:12px;color:var(--ink-dim)}
.spect{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:12px;z-index:4;white-space:nowrap}

@media (max-height:640px){.hand .card{--cw:min(68px,22vw)}.hand{min-height:calc(min(68px,22vw)*1.5 + 12px)}.slot .card{--cw:44px}.pile{width:140px;height:164px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="hud">
    <div class="score us"><span class="lbl">Nós</span><b id="sUs">0</b></div>
    <div class="mid"><div id="handVal" class="val">Mão vale 1</div><div class="dots" id="dots"></div></div>
    <div class="score them"><span class="lbl">Eles</span><b id="sThem">0</b></div>
  </header>
  <main class="table" id="table">
    <div class="vira" id="vira"></div>
    <button class="tbtn snd-btn" id="sndBtn" aria-label="Som"></button>
    <button class="tbtn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="seat s2 partner" id="seat2"></div>
    <div class="seat s3" id="seat3"></div>
    <div class="seat s1" id="seat1"></div>
    <div class="pile" id="pile"></div>
    <div class="bubble b0" id="bub0"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sheet" id="sheet" hidden></div>
    <div class="spect" id="spect" hidden>Assistindo · toque em ☰ para entrar numa vaga de bot</div>
  </main>
  <section class="hand" id="hand" aria-label="Suas cartas"></section>
  <footer class="actions" id="actions"></footer>
</div>
<div class="modal" id="modal" hidden></div>

<script>
/*ENGINE-START*/
// baralho espanhol de 40 cartas, da mais fraca à mais forte no truco
const RANKS=['4','5','6','7','10','11','12','1','2','3'];
const SUIT_NAMES=['ouros','espadas','copas','paus']; // força das manilhas: ouros < espadas < copas < paus (zap)
const VALUE_LABEL={3:'TRUCO!',6:'SEIS!',9:'NOVE!',12:'DOZE!'};
const team=s=>s%2;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(){const d=[];for(const r of RANKS)for(let s=0;s<4;s++)d.push({r,s});return d;}
function manilhaOf(r){return RANKS[(RANKS.indexOf(r)+1)%RANKS.length];}
function power(c,man){return c.r===man?10+c.s:RANKS.indexOf(c.r);}
function nextValue(v){return v===1?3:v+3;}

function newGame(diff){return{scores:[0,0],dealer:Math.floor(Math.random()*4),diff,phase:'idle',events:[],handNo:0,hands:[[],[],[],[]],table:[],played:[],results:[],value:1,mao11:null,ferro:false};}

function startHand(g){
  g.dealer=(g.dealer+1)%4; g.handNo++;
  const d=shuffle(makeDeck());
  g.hands=[[],[],[],[]];
  for(let i=0;i<3;i++)for(let k=1;k<=4;k++)g.hands[(g.dealer+k)%4].push(d.pop());
  g.vira=d.pop(); g.manilha=manilhaOf(g.vira.r);
  Object.assign(g,{value:1,lock:null,pending:null,results:[],table:[],played:[],lastTrick:null,mao11:null,ferro:false,handResult:null});
  g.leader=(g.dealer+1)%4; g.turn=g.leader;
  const at11=[0,1].filter(t=>g.scores[t]===11);
  if(at11.length===2){g.ferro=true;g.phase='play';g.events.push({type:'toast',text:'Mão de ferro! Sem truco, vale 1.'});}
  else if(at11.length===1){g.mao11=at11[0];g.value=3;g.phase='mao11';g.events.push({type:'voice',key:'mao11'});}
  else g.phase='play';
}
function canTruco(g,seat){return g.phase==='play'&&g.turn===seat&&g.mao11===null&&!g.ferro&&g.value<12&&g.lock!==team(seat);}
function actTruco(g,seat){
  if(!canTruco(g,seat))throw new Error('truco inválido');
  const v=nextValue(g.value);
  g.pending={team:team(seat),value:v,seat};
  g.phase='respond';
  g.events.push({type:'say',seat,text:VALUE_LABEL[v],kind:'call'});
}
function actRespond(g,choice,seat){
  if(g.phase!=='respond')throw new Error('não há pedido');
  const p=g.pending, rt=1-p.team;
  if(team(seat)!==rt)throw new Error('quem responde é a outra dupla');
  if(choice==='accept'){
    g.value=p.value; g.lock=p.team; g.pending=null; g.phase='play';
    g.events.push({type:'say',seat,text:pick(['Desce!','Aceito!','Manda!','Bora!']),kind:'accept'});
  }else if(choice==='run'){
    g.events.push({type:'say',seat,text:pick(['Corro!','Tô fora!','Pode levar…']),kind:'run'});
    endHand(g,p.team,g.value,'run');
  }else if(choice==='raise'){
    if(p.value>=12)throw new Error('já está em doze');
    g.value=p.value;
    const v=nextValue(p.value);
    g.pending={team:rt,value:v,seat};
    g.events.push({type:'say',seat,text:VALUE_LABEL[v],kind:'call'});
  }else throw new Error('resposta desconhecida');
}
function actPlay(g,seat,idx){
  if(g.phase!=='play'||g.turn!==seat)throw new Error('jogada fora de hora');
  const c=g.hands[seat].splice(idx,1)[0];
  if(!c)throw new Error('carta inexistente');
  const prev=tableBest(g), pc=power(c,g.manilha);
  g.table.push({seat,card:c}); g.played.push({seat,card:c});
  if(pc===13)g.events.push({type:'voice',key:'zap_1'});
  else if(pc>=10&&prev&&prev.team!=='tie'&&prev.team!==team(seat)&&pc>prev.p)g.events.push({type:'voice',key:'zap_2'});
  if(g.table.length===4)resolveTrick(g); else g.turn=(seat+1)%4;
}
function tableBest(g){
  if(!g.table.length)return null;
  let max=-1; for(const t of g.table)max=Math.max(max,power(t.card,g.manilha));
  const tops=g.table.filter(t=>power(t.card,g.manilha)===max);
  const teams=new Set(tops.map(t=>team(t.seat)));
  return{p:max,team:teams.size===1?team(tops[0].seat):'tie',seat:tops[0].seat};
}
function handWinnerOf(r){
  const w=[0,1].map(t=>r.filter(x=>x===t).length);
  if(w[0]>=2)return 0; if(w[1]>=2)return 1;
  if(r.length>=2){
    if(r[0]==='tie'&&r[1]!=='tie')return r[1];
    if(r[0]!=='tie'&&r[1]==='tie')return r[0];
  }
  if(r.length===3){if(r[2]!=='tie')return r[2];const f=r.find(x=>x!=='tie');return f===undefined?'none':f;}
  return null;
}
function resolveTrick(g){
  const b=tableBest(g);
  g.results.push(b.team);
  g.lastTrick={team:b.team,seat:b.seat};
  g.phase='trickDone';
}
function endHand(g,winner,pts,reason){
  if(winner!=='none')g.scores[winner]=Math.min(12,g.scores[winner]+pts);
  if(reason==='tricks'&&winner!=='none'&&pts>=3)g.events.push({type:'voice',key:'ganhou_mao'});
  g.handResult={winner,pts:winner==='none'?0:pts,reason};
  g.pending=null; g.phase='handDone';
}
function actMao11(g,play){
  if(g.phase!=='mao11')throw new Error('não é mão de 11');
  if(play){g.phase='play';g.events.push({type:'toast',text:'Mão de 11: vale 3!'});}
  else{g.events.push({type:'say',seat:g.mao11,text:'Corro!',kind:'run'});endHand(g,1-g.mao11,1,'mao11');}
}
function advance(g){
  if(g.phase==='trickDone'){
    g.table=[];
    const hw=handWinnerOf(g.results);
    if(hw!==null){endHand(g,hw,g.value,'tricks');return;}
    g.leader=g.lastTrick.seat; g.turn=g.leader; g.phase='play';
  }else if(g.phase==='handDone'){
    if(g.scores[0]>=12||g.scores[1]>=12){g.phase='over';g.winner=g.scores[0]>=12?0:1;g.events.push({type:'voice',key:'fim',team:g.winner});}
    else startHand(g);
  }else if(g.phase==='idle')startHand(g);
}
function whoActs(g){
  switch(g.phase){
    case 'play':return{kind:'play',seat:g.turn};
    case 'respond':return{kind:'respond',team:1-g.pending.team};
    case 'mao11':return{kind:'mao11',team:g.mao11};
    case 'trickDone':case 'handDone':case 'idle':return{kind:'advance'};
    default:return{kind:'over'};
  }
}

/* ---------- bots ----------
   Fácil: regras de bolso e alguns erros.
   Médio e difícil: lembram as cartas que já saíram e simulam o resto da mão
   centenas de vezes (com as cartas escondidas sorteadas) para estimar a chance de ganhar. */
const DIFF={
  facil:  {mc:0,  call:.80,bluff:.02,acc:.38,raise:.90,noise:.18,blunder:.4},
  medio:  {mc:60, callP:.68,bluff:.05,raiseP:.80,respDisc:.03,noise:.08,blunder:.06},
  dificil:{mc:260,callP:.78,bluff:.02,raiseP:.86,respDisc:.03,noise:.02,blunder:0}
};
const cfgOf=g=>DIFF[g.diff]||DIFF.medio;

// heurística rápida (bot fácil e simulações)
function evalSeat(g,seat){
  const my=team(seat);
  const ps=g.hands[seat].map(c=>power(c,g.manilha)).sort((a,b)=>b-a);
  const won=g.results.filter(r=>r===my).length, lost=g.results.filter(r=>r!=='tie'&&r!==my).length;
  const W=[1,.55,.3]; let s=0,n=0;
  ps.forEach((p,i)=>{s+=W[i]*Math.min(1,p/12);n+=W[i];});
  s=n?s/n:0;
  if(won)s+=.22; if(lost)s-=.22;
  const tb=tableBest(g), mine=g.table.some(t=>t.seat===seat);
  if(tb){
    if(tb.team===my)s+=.1;
    else if(tb.team!=='tie'&&!mine&&!ps.some(p=>p>tb.p))s-=.25;
  }
  return Math.max(0,Math.min(1,s));
}
function cardHeur(g,seat){
  const h=g.hands[seat], ps=h.map(c=>power(c,g.manilha));
  const asc=ps.map((p,i)=>i).sort((a,b)=>ps[a]-ps[b]);
  const low=asc[0], high=asc[asc.length-1], my=team(seat), tb=tableBest(g);
  if(!tb){
    if(g.results.length===0&&h.length===3){const mid=asc[1];if(ps[high]>=10&&ps[mid]>=6)return mid;}
    return high;
  }
  let oppAfter=0; for(let k=1;k<=3-g.table.length;k++)if(team((seat+k)%4)!==my)oppAfter++;
  if(tb.team===my){
    if(oppAfter===0||tb.p>=9)return low;
    const beat=asc.filter(i=>ps[i]>tb.p&&ps[i]>=8);
    return beat.length&&g.results.length>0?beat[0]:low;
  }
  const beat=asc.filter(i=>ps[i]>tb.p);
  if(beat.length)return beat[0];
  const tieI=asc.find(i=>ps[i]===tb.p);
  if(tieI!==undefined&&tb.team!=='tie'&&g.results[0]===my)return tieI; // amarrar garante a mão
  return low;
}

// simulação: sorteia as cartas que o bot não vê e joga o resto da mão
const ckey=c=>c.r+'|'+c.s;
function sampleHands(g,seat,fixed){
  const keep=new Set([seat,...fixed]);
  const known=new Set([g.vira,...g.played.map(p=>p.card)].map(ckey));
  keep.forEach(s=>g.hands[s].forEach(c=>known.add(ckey(c))));
  const pool=shuffle(makeDeck().filter(c=>!known.has(ckey(c))));
  return g.hands.map((h,s)=>keep.has(s)?h.slice():pool.splice(0,h.length));
}
function rollout(g,hands,firstIdx){
  const c={hands,table:g.table.slice(),results:g.results.slice(),manilha:g.manilha,turn:g.turn};
  const play=(seat,idx)=>{const card=c.hands[seat].splice(idx,1)[0];c.table.push({seat,card});if(c.table.length<4)c.turn=(seat+1)%4;};
  if(firstIdx!=null)play(c.turn,firstIdx);
  for(let guard=0;guard<16;guard++){
    if(c.table.length===4){
      const b=tableBest(c);c.results.push(b.team);c.table=[];
      const hw=handWinnerOf(c.results);if(hw!==null)return hw;
      c.turn=b.seat;continue;
    }
    play(c.turn,cardHeur(c,c.turn));
  }
  return 'none';
}
const credit=(r,my)=>r===my?1:r==='none'?.5:0;
function winProb(g,seat,n,fixed=[]){
  let w=0;for(let i=0;i<n;i++)w+=credit(rollout(g,sampleHands(g,seat,fixed),null),team(seat));
  return w/n;
}
function mcCard(g,seat,n){
  const h=g.hands[seat]; if(h.length===1)return 0;
  const my=team(seat), score=h.map(()=>0), pw=h.map(c=>power(c,g.manilha));
  for(let i=0;i<n;i++){
    const base=sampleHands(g,seat,[]);
    for(let k=0;k<h.length;k++)score[k]+=credit(rollout(g,base.map(x=>x.slice()),k),my);
  }
  const tol=n*.02; let best=0;
  for(let k=1;k<h.length;k++){
    if(score[k]>score[best]+tol||(Math.abs(score[k]-score[best])<=tol&&pw[k]<pw[best]))best=k; // empate técnico: guarda a carta forte
  }
  return best;
}

function botWantsTruco(g,seat){
  if(!canTruco(g,seat))return false;
  const cfg=cfgOf(g), my=team(seat), nv=nextValue(g.value);
  if(!cfg.mc){
    const s=evalSeat(g,seat)+(Math.random()-.5)*cfg.noise*2;
    if(s>=cfg.call)return true;
    if(g.scores[1-my]+nv>=12)return false;
    return Math.random()<cfg.bluff;
  }
  const P=winProb(g,seat,cfg.mc)+(Math.random()-.5)*cfg.noise*2;
  if(P>=cfg.callP)return true;
  if(g.scores[1-my]+nv>=12)return false;        // não blefa se o adversário pode fechar o jogo
  return P<.4&&Math.random()<cfg.bluff;           // blefe de mão fraca
}
function botRespond(g,t){
  const cfg=cfgOf(g), p=g.pending, v=g.value, nv=p.value, opp=p.team;
  if(!cfg.mc){
    let best=-1,seat=t;
    for(const s of [t,t+2]){const e=evalSeat(g,s);if(e>best){best=e;seat=s;}}
    const s=best+(Math.random()-.5)*cfg.noise*2;
    if(nv<12&&s>=cfg.raise)return{choice:'raise',seat};
    if(s>=cfg.acc||g.scores[opp]+v>=12)return{choice:'accept',seat};
    return{choice:'run',seat};
  }
  let P=-1,seat=t;
  for(const s of [t,t+2]){const x=winProb(g,s,cfg.mc);if(x>P){P=x;seat=s;}}
  P=P-cfg.respDisc+(Math.random()-.5)*cfg.noise*2;   // quem pede costuma ter jogo
  if(nv<12&&P>=cfg.raiseP)return{choice:'raise',seat};
  if(g.scores[opp]+v>=12)return{choice:'accept',seat}; // correr perderia o jogo de qualquer jeito
  let thr=(1-v/nv)/2+.04;                              // vale aceitar quando P·nv − (1−P)·nv > −v
  if(g.scores[opp]+nv>=12)thr+=.12;
  if(g.scores[t]+nv>=12)thr-=.05;
  return{choice:P>=thr?'accept':'run',seat};
}
function botMao11(g,t){
  const cfg=cfgOf(g);
  if(!cfg.mc){const a=evalSeat(g,t),b=evalSeat(g,t+2);return (a+b)/2>=.42||Math.max(a,b)>=.62;}
  return winProb(g,t,cfg.mc,[t+2])>=.38;               // a dupla vê as próprias seis cartas
}
function botCard(g,seat){
  const cfg=cfgOf(g), h=g.hands[seat];
  if(Math.random()<cfg.blunder)return Math.floor(Math.random()*h.length);
  return cfg.mc?mcCard(g,seat,cfg.mc):cardHeur(g,seat);
}
function botTurn(g,seat){if(botWantsTruco(g,seat))actTruco(g,seat);else actPlay(g,seat,botCard(g,seat));}

/* ---------- mesa online ---------- */
const ci=c=>RANKS.indexOf(c.r)*4+c.s, cd=i=>({r:RANKS[i>>2],s:i&3});
function encode(){
  const base={v:1,code:CODE,gid:GID,diff,seats:SEATS.map(x=>x&&{p:x.p,n:x.n}),on:LOBBY||!G?0:1};
  if(!base.on)return base;

  return Object.assign(base,{ph:g.phase,sc:g.scores,hn:g.handNo,h:g.hands.map(h=>h.map(ci)),t:g.table.map(x=>[x.seat,ci(x.card)]),
    vr:g.vira?ci(g.vira):-1,val:g.value,lk:g.lock,pd:g.pending,rs:g.results,tu:g.turn,m11:g.mao11,fe:g.ferro?1:0,
    lt:g.lastTrick,hr:g.handResult,w:g.winner==null?null:g.winner,ev:evLog});
}
function decode(st){
  const okc=i=>Number.isInteger(i)&&i>=0&&i<40;
  if(!Array.isArray(st.h)||st.h.length!==4||!st.h.every(h=>Array.isArray(h)&&h.every(okc)))throw new Error('estado inválido');
  const g={phase:String(st.ph),scores:[+st.sc[0]||0,+st.sc[1]||0],handNo:+st.hn||0,hands:st.h.map(h=>h.map(cd)),
    table:(st.t||[]).filter(x=>Array.isArray(x)&&okc(x[1])).map(([s,c])=>({seat:s&3,card:cd(c)})),
    vira:okc(st.vr)?cd(st.vr):null,value:+st.val||1,lock:st.lk,pending:st.pd||null,results:Array.isArray(st.rs)?st.rs:[],
    turn:(+st.tu)&3,mao11:st.m11==null?null:st.m11,ferro:!!st.fe,lastTrick:st.lt||null,handResult:st.hr||null,winner:st.w,events:[],played:[],diff};
  g.manilha=g.vira?manilhaOf(g.vira.r):null;
  return g;
}
function publish(){

async function getRoomNS(){

const CODE_CH='abcdefghjkmnpqrstuvwxyz23456789';
const randomCode=()=>Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
const normCode=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,4);
function onlineMsg(t){const m=$('onlineMsg');if(m)m.textContent=t;}
async function enterTable(code,host){

  if(!/^[a-z0-9]{4}$/.test(code)){onlineMsg('O código da mesa tem 4 letras ou números.');return;}

function onRoomPeers(){

function hostReconcile(peers){
  const live=new Set(peers.map(p=>p.peer)); let changed=false; const acts=[];
  SEATS=SEATS.map(x=>{if(x&&!live.has(x.p)){changed=true;return null;}return x;});
  for(const p of peers){
    const pr=p.presence||{}, nk=cleanNick(pr.n)||'Jogador';
    let cur=SEATS.findIndex(x=>x&&x.p===p.peer);
    if(cur>=0&&SEATS[cur].n!==nk){SEATS[cur]={p:p.peer,n:nk};changed=true;}
    const want=pr.want;
    if(want===-1&&cur>=0){SEATS[cur]=null;cur=-1;changed=true;}
    else if(Number.isInteger(want)&&want>=0&&want<4&&want!==cur&&!SEATS[want]){if(cur>=0)SEATS[cur]=null;SEATS[want]={p:p.peer,n:nk};cur=want;changed=true;}

    }

function clientSync(peers){

  RM.presence({want:s}).then(()=>{if(IS_HOST&&RM)hostReconcile(RM.peers());}).catch(()=>{});
}

function lobbyHTML(){

  const seat=s=>{const x=SEATS[s], mine=s===ME;
    const act=mine?'stand':x?'':'sit';
    return `<button class="seatbtn${mine?' mine':''}${x?'':' empty'}" data-a="${act}" data-seat="${s}"${!mine&&x?' disabled':''}>
      <span class="nm">${x?esc(mine?'Você':x.n):'Bot'}</span><span class="sub2">${mine?'toque para levantar':x?'jogando':'toque para sentar'}</span></button>`;};
  const foot=IS_HOST&&!inGame?`<div class="seg-lbl">Dificuldade dos bots</div>${segHTML()}<div class="stack"><button class="btn primary big" data-a="start">Começar partida</button>`
    :inGame?`<div class="stack">${ME>=0?'<button class="btn primary big" data-a="cont">Voltar ao jogo</button>':'<p class="sub">Toque numa cadeira de bot para entrar no jogo.</p><button class="btn ghost big" data-a="cont">Assistir</button>'}`
    :`<div class="stack"><p class="sub">Esperando o anfitrião começar…</p>`;
  return `<div class="modal-card" role="dialog" aria-modal="true" aria-label="Mesa">
    <div class="sub">Código da mesa</div><div class="codebox">${esc(CODE.toUpperCase())}</div>
    <button class="btn ghost" data-a="copy">Copiar código</button>
    <p class="sub" style="margin-top:12px">Mande o código pros amigos. Cadeira vazia vira bot.</p>
    <div class="seats"><div class="team-lbl">Dupla A</div><div class="team-lbl">Dupla B</div>${[0,1,2,3].map(seat).join('')}</div>
    ${foot}<button class="btn ghost big" data-a="leave">Sair da mesa</button></div></div>`;
}

/* sala simulada entre abas (só para testes locais com ?fakeroom) */
function FakeRoom(){
  const me=Math.random().toString(36).slice(2,10);
  return{join:async name=>{
    const bc=new BroadcastChannel('fakeroom-'+name), others=new Map(), hs=new Set();
    let pres=Object.freeze({}), snap=Object.freeze([]), alive=true;
    const mk=(peer,p,isMe)=>Object.freeze({peer,by:null,isMe,sameTab:isMe,kind:'viewer',guest:false,presence:p,updatedAt:Date.now()});
    let mine=mk(me,pres,true);
    const fire=()=>{snap=Object.freeze([mine,...[...others.values()].map(o=>o.peer)]);const c={peers:snap,joined:[],left:[],updated:[]};queueMicrotask(()=>hs.forEach(h=>h(c)));};
    const send=()=>{if(alive)bc.postMessage({peer:me,pres});};
    bc.onmessage=e=>{const m=e.data;if(!m||m.peer===me)return;
      if(m.bye){if(others.delete(m.peer))fire();return;}
      const ex=others.get(m.peer), js=JSON.stringify(m.pres);
      if(ex&&ex.js===js){ex.seen=Date.now();return;}
      others.set(m.peer,{peer:mk(m.peer,Object.freeze(m.pres),false),js,seen:Date.now()});if(!ex)send();fire();};
    const hb=setInterval(()=>{send();const now=Date.now();let ch=false;for(const [k,o] of others)if(now-o.seen>3000){others.delete(k);ch=true;}if(ch)fire();},700);
    send();fire();
    return{name,
      presence:async patch=>{const next=Object.assign({},pres);for(const k in patch){if(patch[k]===null)delete next[k];else next[k]=patch[k];}
        if(new TextEncoder().encode(JSON.stringify(next)).length>4096)throw{code:'invalid_argument',message:'presença acima de 4 KiB'};
        pres=Object.freeze(next);mine=mk(me,pres,true);send();fire();},
      peers:()=>snap,
      onPeers:h=>{hs.add(h);queueMicrotask(()=>h({peers:snap,joined:snap,left:[],updated:[]}));return()=>hs.delete(h);},
      connected:()=>true,
      leave:async()=>{alive=false;clearInterval(hb);bc.postMessage({peer:me,bye:1});bc.close();hs.clear();}};
  }};
}
